[env]
openssl_path = "E:\\Program Files\\Git\\usr\\bin\\openssl.exe"


[authentication]
verifier = "free"
scheme = "basic,digest-sha2-256,digest-md5"


[inbound.normal]
enable = true
listen = "http://0.0.0.0:7890"

[inbound.secure]
enable = true
listen = "https://0.0.0.0:7891"
hostname = "localhost"


[outbound.tor]
enable = true
origin = "http://127.0.0.1:8118"


[log]
level = 5


[dns]
cache-expiration = 7200
load-local-host-file = true


[dns-server]
normal = "udp://119.29.29.29"
secure = "tls://130.59.31.251"

